name: Deploy security content

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - '**/*.bicep'
      - '**/*.bicepparam'
      - '**/*.json'
      - '**/*.bicepparam'
      - '**/*.json'
      - 'sentinel-deployment.config'
      - '.github/workflows/content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.yml'
      - '.github/workflows/azure-content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.ps1'
      - '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.ps1'
      - '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.Paths.ps1'
      - '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.Candidates.ps1'
      - '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.Store.ps1'

concurrency:
  group: content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOURCE_CONTROL_ID: 'b6a10991-905a-afab-bda8-4079aa8b1808'
      DEPLOYMENT_SCOPE_ID: '/providers/Microsoft.Management/managementGroups/ContentManagement-CICD'
      WORKSPACE_ID: ''
      WORKSPACE_NAME: ''
      DEPLOYMENT_LOCATION: 'eastus2'
      CONTENT_ROOT: '.'
      CONTENT_TYPES: 'CustomDetection,DefenderWorkbook'
      TRACKED_BRANCH: 'main'
      AZURE_CLOUD_ENVIRONMENT: 'AzureCloud'
      DEPLOYMENT_SCRIPT_VERSION: '1.0.0+af43c81018a634a394b32d954de5f242ced9f856'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize deployment paths
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DEPLOYMENT_CANDIDATES_PATH=$env:RUNNER_TEMP\content-deployment-candidates.json"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DEPLOYMENT_RESULTS_PATH=$env:RUNNER_TEMP\content-deployment-results.json"

      - name: Prepare deployment candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stateScript = '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.ps1'
          & $stateScript `
            -Action Prepare `
            -SourceControlId $env:SOURCE_CONTROL_ID `
            -TrackedBranch $env:TRACKED_BRANCH `
            -ContentRoot $env:CONTENT_ROOT `
            -WorkspaceId $env:WORKSPACE_ID `
            -WorkflowPath '.github/workflows/content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.yml' `
            -DeploymentScriptPath '.github/workflows/azure-content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.ps1' `
            -StateScriptPath $stateScript `
            -CandidatesPath $env:DEPLOYMENT_CANDIDATES_PATH `
            -ResultsPath $env:DEPLOYMENT_RESULTS_PATH

      - name: Summarize deployment configuration
        shell: pwsh
        run: |
          $stateLocation = if ([string]::IsNullOrWhiteSpace($env:DEPLOYMENT_STATE_URL)) {
            'Unavailable'
          } else {
            "[$env:DEPLOYMENT_STATE_BRANCH/$env:DEPLOYMENT_STATE_PATH]($env:DEPLOYMENT_STATE_URL)"
          }
          @"
          ### Content deployment

          | Setting | Value |
          | --- | --- |
          | Source control ID | $env:SOURCE_CONTROL_ID |
          | Scope | $env:DEPLOYMENT_SCOPE_ID |
          | Workspace ID | $env:WORKSPACE_ID |
          | Workspace name | $env:WORKSPACE_NAME |
          | Location | $env:DEPLOYMENT_LOCATION |
          | Content root | $env:CONTENT_ROOT |
          | Azure environment | $env:AZURE_CLOUD_ENVIRONMENT |
          | Script version | $env:DEPLOYMENT_SCRIPT_VERSION |
          | Commit | $env:GITHUB_SHA |
          | Deployment state | $stateLocation |
          "@ >> $env:GITHUB_STEP_SUMMARY
          'DEPLOYMENT_CONFIG_SUMMARIZED=true' >> $env:GITHUB_ENV

      - name: Validate Azure login configuration
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.CAC_CLIENT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          AZURE_TENANT_ID: ${{ secrets.CAC_TENANT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            throw 'GitHub secret CAC_CLIENT_ID_B6A10991905AAFABBDA84079AA8B1808 is missing or empty.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw 'GitHub secret CAC_TENANT_ID_B6A10991905AAFABBDA84079AA8B1808 is missing or empty.'
          }

          $parsedId = [guid]::Empty
          if (-not [guid]::TryParse($env:AZURE_CLIENT_ID, [ref]$parsedId)) {
            throw 'GitHub secret CAC_CLIENT_ID_B6A10991905AAFABBDA84079AA8B1808 must contain an application client ID GUID.'
          }

          if (-not [guid]::TryParse($env:AZURE_TENANT_ID, [ref]$parsedId)) {
            throw 'GitHub secret CAC_TENANT_ID_B6A10991905AAFABBDA84079AA8B1808 must contain a tenant ID GUID.'
          }

      - name: Sign in to Azure with GitHub OIDC
        id: azure_login_1
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' }}
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CAC_CLIENT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          tenant-id: ${{ secrets.CAC_TENANT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          allow-no-subscriptions: true
          enable-AzPSSession: true
          environment: AzureCloud
          audience: api://AzureADTokenExchange

      - name: Wait before Azure login retry 2
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' && steps.azure_login_1.outcome == 'failure' }}
        shell: pwsh
        run: Start-Sleep -Seconds 15

      - name: Retry Azure login 2
        id: azure_login_2
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' && steps.azure_login_1.outcome == 'failure' }}
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CAC_CLIENT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          tenant-id: ${{ secrets.CAC_TENANT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          allow-no-subscriptions: true
          enable-AzPSSession: true
          environment: AzureCloud
          audience: api://AzureADTokenExchange

      - name: Wait before Azure login retry 3
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' && steps.azure_login_2.outcome == 'failure' }}
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Retry Azure login 3
        id: azure_login_3
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' && steps.azure_login_2.outcome == 'failure' }}
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CAC_CLIENT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          tenant-id: ${{ secrets.CAC_TENANT_ID_B6A10991905AAFABBDA84079AA8B1808 }}
          allow-no-subscriptions: true
          enable-AzPSSession: true
          environment: AzureCloud
          audience: api://AzureADTokenExchange

      - name: Report Azure login failure
        if: ${{ env.DEPLOYMENT_CANDIDATE_COUNT != '0' && steps.azure_login_1.outcome == 'failure' && steps.azure_login_2.outcome == 'failure' && steps.azure_login_3.outcome == 'failure' }}
        shell: pwsh
        run: |
          throw @'
          Azure login failed after 3 attempts. Client and tenant IDs are present and valid GUIDs.
          Verify the GitHub federated credential repository, branch subject, tenant, audience,
          and application ID. If configuration is correct, rerun the workflow after the transient
          Azure or Entra ID failure clears.
          '@

      - name: Deploy changed security content
        shell: pwsh
        run: |
          function ConvertTo-SummaryCell {
            param([Parameter(Mandatory = $true)][string]$Value)

            return [Net.WebUtility]::HtmlEncode($Value).
              Replace('|', '&#124;', [StringComparison]::Ordinal).
              Replace("`r", ' ', [StringComparison]::Ordinal).
              Replace("`n", ' ', [StringComparison]::Ordinal)
          }

          $templateFiles = @(
            Get-Content -LiteralPath $env:DEPLOYMENT_CANDIDATES_PATH -Raw |
              ConvertFrom-Json |
              ForEach-Object { [string]$_ }
          )
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE `
            '.github/workflows/azure-content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.ps1'
          . '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.ps1'
          $parameterMappings = Get-ParameterFileMapping -WorkspaceId $env:WORKSPACE_ID
          @(
            ''
            '## Selected deployment templates'
            '| Template | Parameter file | Deployment name | Status | Error |'
            '| --- | --- | --- | --- | --- |'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Host "Selected $($templateFiles.Count) deployment template(s)."

          $deploymentFailures = [Collections.Generic.List[object]]::new()
          for ($index = 0; $index -lt $templateFiles.Count; $index++) {
            $templateFile = $templateFiles[$index]
            $deploymentName = 'content-${{ github.run_id }}-{0}' -f $index
            $parameterFile = $null
            $parameterFileDisplay = 'None'
            $skippedPath = Join-Path $env:RUNNER_TEMP "content-deployment-skipped-$index"
            if (Test-Path -LiteralPath $skippedPath) {
              Remove-Item -LiteralPath $skippedPath -Force
            }
            $arguments = @{
              TemplateFile = $templateFile
              DeploymentName = $deploymentName
              DeploymentScopeId = $env:DEPLOYMENT_SCOPE_ID
              WorkspaceId = $env:WORKSPACE_ID
              WorkspaceName = $env:WORKSPACE_NAME
              Location = $env:DEPLOYMENT_LOCATION
              ContentTypes = $env:CONTENT_TYPES -split ','
              SkippedPath = $skippedPath
            }

            $templateCell = ConvertTo-SummaryCell $templateFile
            $deploymentCell = ConvertTo-SummaryCell $deploymentName
            try {
              $parameterFile = Get-DeploymentParameterFile `
                -TemplatePath $templateFile `
                -WorkspaceId $env:WORKSPACE_ID `
                -ParameterMappings $parameterMappings
              if ($null -ne $parameterFile) {
                $arguments.TemplateParameterFile = $parameterFile
                $parameterFileDisplay = $parameterFile
              }
              Write-Host "Deploying template '$templateFile' with parameter file '$parameterFileDisplay' as deployment '$deploymentName'."
              $parameterCell = ConvertTo-SummaryCell $parameterFileDisplay
              & $scriptPath @arguments
              if (Test-Path -LiteralPath $skippedPath) {
                "| $templateCell | $parameterCell | $deploymentCell | Skipped | Unsupported content type |" |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              } else {
                "| $templateCell | $parameterCell | $deploymentCell | Succeeded | |" |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              }
            } catch {
              $parameterCell = ConvertTo-SummaryCell $parameterFileDisplay
              $errorMessage = [string]$_.Exception.Message
              $errorCell = ConvertTo-SummaryCell $errorMessage
              "| $templateCell | $parameterCell | $deploymentCell | Failed | $errorCell |" |
                Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              Write-Error "Deployment failed for '$templateFile': $errorMessage" -ErrorAction Continue
              $deploymentFailures.Add([pscustomobject]@{
                Template = $templateFile
                Error = $errorMessage
              })
            }
          }

          ConvertTo-Json -InputObject @($deploymentFailures | ForEach-Object { $_.Template }) |
            Set-Content -LiteralPath $env:DEPLOYMENT_RESULTS_PATH

          if ($deploymentFailures.Count -gt 0) {
            $failedTemplates = $deploymentFailures.Template -join "', '"
            throw "$($deploymentFailures.Count) of $($templateFiles.Count) template deployments failed: '$failedTemplates'."
          }

      - name: Update deployment state
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stateScript = '.github/workflows/azure-content-state-b6a10991-905a-afab-bda8-4079aa8b1808.ps1'
          & $stateScript `
            -Action Complete `
            -SourceControlId $env:SOURCE_CONTROL_ID `
            -TrackedBranch $env:TRACKED_BRANCH `
            -ContentRoot $env:CONTENT_ROOT `
            -WorkspaceId $env:WORKSPACE_ID `
            -WorkflowPath '.github/workflows/content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.yml' `
            -DeploymentScriptPath '.github/workflows/azure-content-deploy-b6a10991-905a-afab-bda8-4079aa8b1808.ps1' `
            -StateScriptPath $stateScript `
            -CandidatesPath $env:DEPLOYMENT_CANDIDATES_PATH `
            -ResultsPath $env:DEPLOYMENT_RESULTS_PATH

      - name: Publish deployment result
        if: always()
        shell: pwsh
        run: |
          $status = '${{ job.status }}'
          if ($env:DEPLOYMENT_CONFIG_SUMMARIZED -ne 'true') {
            $stateLocation = if ([string]::IsNullOrWhiteSpace($env:DEPLOYMENT_STATE_URL)) {
              'Unavailable'
            } else {
              "[$env:DEPLOYMENT_STATE_BRANCH/$env:DEPLOYMENT_STATE_PATH]($env:DEPLOYMENT_STATE_URL)"
            }
            @(
              '### Content deployment'
              ''
              '| Setting | Value |'
              '| --- | --- |'
              "| Source control ID | $env:SOURCE_CONTROL_ID |"
              "| Scope | $env:DEPLOYMENT_SCOPE_ID |"
              "| Workspace ID | $env:WORKSPACE_ID |"
              "| Workspace name | $env:WORKSPACE_NAME |"
              "| Location | $env:DEPLOYMENT_LOCATION |"
              "| Content root | $env:CONTENT_ROOT |"
              "| Azure environment | $env:AZURE_CLOUD_ENVIRONMENT |"
              "| Script version | $env:DEPLOYMENT_SCRIPT_VERSION |"
              "| Commit | $env:GITHUB_SHA |"
              "| Deployment state | $stateLocation |"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          @(
            ''
            '## Deployment result'
            '| Status |'
            '| --- |'
            "| $status |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
